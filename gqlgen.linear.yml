schema:
  - api/graphql/linear/*.graphqls

exec:
  filename: internal/graphql/linear/generated.go
  package: linear

model:
  filename: internal/graphql/linear/models_gen.go
  package: linear

resolver:
  layout: follow-schema
  dir: internal/graphql/linear
  package: linear
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: true
# Fields with a resolver are left out of the generated models.
omit_resolver_fields: true
# Every field with arguments (connections) is marked resolver: true below, so
# its arguments reach a resolver instead of binding to a model field.

models:
  DateTime:
    model: github.com/askuksov/yalkos/internal/graphql/linear.DateTime
  TimelessDate:
    model: github.com/askuksov/yalkos/internal/graphql/linear.TimelessDate
  JSON:
    model: github.com/askuksov/yalkos/internal/graphql/linear.JSONText
  JSONObject:
    model: github.com/askuksov/yalkos/internal/graphql/linear.JSONObject
  DateTimeOrDuration:
    model: github.com/99designs/gqlgen/graphql.String
  TimelessDateOrDuration:
    model: github.com/99designs/gqlgen/graphql.String
  User:
    fields:
      createdIssueCount:
        resolver: true
      assignedIssues:
        resolver: true
  Team:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/project.Project
    fields:
      defaultIssueState:
        resolver: true
      issueCount:
        resolver: true
      states:
        resolver: true
      members:
        resolver: true
      issues:
        resolver: true
      labels:
        resolver: true
  WorkflowState:
    extraFields:
      ProjectID:
        type: github.com/google/uuid.UUID
    fields:
      team:
        resolver: true
  Organization:
    fields:
      teams:
        resolver: true
  Issue:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/issue.Issue
    fields:
      labelIds:
        resolver: true
      team:
        resolver: true
      state:
        resolver: true
      assignee:
        resolver: true
      creator:
        resolver: true
      parent:
        resolver: true
      project:
        resolver: true
      children:
        resolver: true
      relations:
        resolver: true
      attachments:
        resolver: true
      labels:
        resolver: true
      comments:
        resolver: true
  Attachment:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/attachment.Attachment
    fields:
      creator:
        resolver: true
      issue:
        resolver: true
  IssueSearchResult:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/issue.Issue
    fields:
      project:
        resolver: true
      labelIds:
        resolver: true
      team:
        resolver: true
      state:
        resolver: true
      assignee:
        resolver: true
      creator:
        resolver: true
      parent:
        resolver: true
  # Update inputs: null clears what can be empty and is an error otherwise,
  # so every nullable field tells null from absent.
  IssueUpdateInput:
    fields:
      title:
        omittable: true
      description:
        omittable: true
      stateId:
        omittable: true
      priority:
        omittable: true
      labelIds:
        omittable: true
      addedLabelIds:
        omittable: true
      removedLabelIds:
        omittable: true
      sortOrder:
        omittable: true
      teamId:
        omittable: true
      assigneeId:
        omittable: true
      parentId:
        omittable: true
      projectId:
        omittable: true
      dueDate:
        omittable: true
  IssueLabel:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/label.Label
    fields:
      parent:
        resolver: true
      creator:
        resolver: true
  IssueLabelUpdateInput:
    fields:
      name:
        omittable: true
      color:
        omittable: true
      description:
        omittable: true
      groupType:
        omittable: true
      parentId:
        omittable: true
  Comment:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/comment.Comment
    fields:
      issue:
        resolver: true
      user:
        resolver: true
  Project:
    extraFields:
      Src:
        type: github.com/askuksov/yalkos/internal/domain/milestone.Milestone
    fields:
      url:
        resolver: true
      status:
        resolver: true
      state:
        resolver: true
      progress:
        resolver: true
      scope:
        resolver: true
      lead:
        resolver: true
      creator:
        resolver: true
      teams:
        resolver: true
      issues:
        resolver: true
  ProjectUpdateInput:
    fields:
      name:
        omittable: true
      description:
        omittable: true
      content:
        omittable: true
      targetDate:
        omittable: true
      leadId:
        omittable: true
      statusId:
        omittable: true
  CommentUpdateInput:
    fields:
      body:
        omittable: true
