name: yalkos

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yalkos:dev
    ports:
      - "${YALKOS_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://yalkos:yalkos@db:5432/yalkos?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yalkos
      POSTGRES_PASSWORD: yalkos
      POSTGRES_DB: yalkos
    ports:
      # Localhost only: the database must never be reachable from outside the host.
      - "127.0.0.1:${YALKOS_DB_PORT:-54320}:5432"
    volumes:
      - yalkos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yalkos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  yalkos-db:
