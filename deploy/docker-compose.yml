name: yalkos

# Runs a released image from ghcr.io; nothing is built here. Put the settings
# in a .env file next to this one (YALKOS_DB_PASSWORD is required); every key
# is documented in docs/install.md. Optional app settings are passed on as
# empty values and the application applies its own defaults.
# Local development (`make dev`) adds docker-compose.dev.yml: it builds the
# app with live reload, plus Vite and a database port published on 127.0.0.1.

services:
  app:
    image: ghcr.io/askuksov/yalkos:${YALKOS_VERSION:-0.1}
    ports:
      # With YALKOS_BIND set (for example 127.0.0.1) only that address listens.
      - "${YALKOS_BIND:+${YALKOS_BIND}:}${YALKOS_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://yalkos:${YALKOS_DB_PASSWORD:?set YALKOS_DB_PASSWORD, see README}@db:5432/yalkos?sslmode=disable
      LOG_LEVEL: ${YALKOS_LOG_LEVEL:-}
      MAX_UPLOAD_MB: ${YALKOS_MAX_UPLOAD_MB:-}
      API_RATE_LIMIT: ${YALKOS_API_RATE_LIMIT:-}
      WEBHOOK_ALLOW_PRIVATE: ${YALKOS_WEBHOOK_ALLOW_PRIVATE:-}
      TRUSTED_PROXIES: ${YALKOS_TRUSTED_PROXIES:-}
      # Public URL: invite links and Secure cookies (https) depend on it.
      BASE_URL: ${YALKOS_BASE_URL:-http://localhost:${YALKOS_PORT:-8080}}
      # Uploaded files; back them up together with the database.
      DATA_DIR: /data
    volumes:
      - yalkos-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Probes /readyz on the app's own listen address; the image has no shell.
      test: ["CMD", "/yalkos", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    # Longer than the app's own shutdown: 10 s for the server and the delivery
    # queue, plus up to 3 s to record the outcome of an attempt that finished
    # as the queue stopped (about 13 s at worst).
    stop_grace_period: 15s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yalkos
      POSTGRES_PASSWORD: ${YALKOS_DB_PASSWORD:?set YALKOS_DB_PASSWORD, see README}
      POSTGRES_DB: yalkos
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - yalkos-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yalkos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  yalkos-pgdata:
  yalkos-data:
