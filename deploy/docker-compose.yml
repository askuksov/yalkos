name: yalkos

# Production-style setup: only the app port is published.
# Requires YALKOS_DB_PASSWORD (e.g. in deploy/.env, see README).
# Local development adds docker-compose.dev.yml (database port on 127.0.0.1).

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: yalkos:dev
    ports:
      - "${YALKOS_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://yalkos:${YALKOS_DB_PASSWORD:?set YALKOS_DB_PASSWORD, see README}@db:5432/yalkos?sslmode=disable
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yalkos
      POSTGRES_PASSWORD: ${YALKOS_DB_PASSWORD:?set YALKOS_DB_PASSWORD, see README}
      POSTGRES_DB: yalkos
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - yalkos-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yalkos"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  yalkos-pgdata:
