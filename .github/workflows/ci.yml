name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# CI already installs Go, Node, pnpm and golangci-lint; run make targets with
# those instead of building the development Docker images.
env:
  TOOLS: host

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yalkos
          POSTGRES_PASSWORD: yalkos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yalkos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://yalkos:yalkos@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated code is up to date
        run: make check-generated
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Build leaves the tree clean
        run: test -z "$(git status --porcelain)"

  build:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make build
      - run: ./bin/yalkos version | grep "ui embedded"
      - run: make docker
      - run: docker run --rm yalkos:dev version | grep "ui embedded"
      - uses: docker/setup-buildx-action@v4
      - name: Image builds for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 -f deploy/Dockerfile .
      - name: Compose stack becomes healthy
        env:
          YALKOS_VERSION: ci
          YALKOS_DB_PASSWORD: ci-only
        run: |
          docker tag yalkos:dev ghcr.io/askuksov/yalkos:ci
          docker compose -f deploy/docker-compose.yml up -d --wait --wait-timeout 120
          curl -fsS localhost:8080/readyz
          docker compose -f deploy/docker-compose.yml exec -T app /yalkos version | grep "ui embedded"
      - name: Compose logs
        if: failure()
        env:
          YALKOS_VERSION: ci
          YALKOS_DB_PASSWORD: ci-only
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop compose stack
        if: always()
        env:
          YALKOS_VERSION: ci
          YALKOS_DB_PASSWORD: ci-only
        run: docker compose -f deploy/docker-compose.yml down -v

  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yalkos
          POSTGRES_PASSWORD: yalkos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yalkos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      COMPAT_DATABASE_URL: postgres://yalkos:yalkos@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: compat/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: compat/pnpm-lock.yaml
      - run: make compat

  govulncheck:
    # Informational: a finding makes this job red without blocking the pull request.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
