name: Compat (latest SDK)

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: '@linear/sdk version to check'
        default: latest

concurrency:
  group: compat-latest

permissions:
  contents: read

env:
  TOOLS: host
  # The version is only ever read from the environment, never put into a script.
  COMPAT_SDK_VERSION: ${{ inputs.version || 'latest' }}

jobs:
  # The newest SDK is code we do not control: it runs here, without a token
  # that can write, and hands over nothing but the report artifact. It runs in
  # a container that sees only a read-only copy of the repository, the report
  # directory and the variables passed below, so neither the SDK nor its
  # install scripts can reach the runner, its tokens or the Actions cache.
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yalkos
          POSTGRES_PASSWORD: yalkos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yalkos"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      COMPAT_DATABASE_URL: postgres://yalkos:yalkos@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No caches in this job: it runs the newest SDK, so a cache it could write
      # must not be restored by any other workflow.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # The runner context is not available in the job env, so the report
      # directory is set from the step environment.
      - name: Choose the report directory
        run: |
          echo "COMPAT_REPORT_DIR=$RUNNER_TEMP/compat-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/compat-report"
      # Our own code: built on the runner, started by the checks in the container.
      - name: Build the binary
        run: make compat-bin
      # Variables are passed by name, so their values never become part of a
      # script. The container works on its own copy of the repository and uses
      # the runner's Go (read-only) for the static check of the SDK documents.
      - id: check
        run: >-
          docker run --rm --network host
          -e COMPAT_DATABASE_URL -e COMPAT_SDK_VERSION -e GITHUB_ACTIONS -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          -e COMPAT_REPORT_DIR=/report -e COMPAT_BIN=/work/bin/yalkos-host
          -v "$GITHUB_WORKSPACE:/src:ro" -v "$COMPAT_REPORT_DIR:/report" -v "$(go env GOROOT):/opt/go:ro"
          node:24-bookworm sh -ec '
          export PATH=/opt/go/bin:$PATH;
          apt-get update -qq && apt-get install -y -qq postgresql-client > /dev/null;
          cp -r /src /work && cd /work/compat;
          corepack enable && pnpm install --frozen-lockfile;
          node run.mjs --mode latest'

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-report
          path: ${{ runner.temp }}/compat-report

  # Reads the report as data and manages the issue. It runs even when the check
  # failed, which is when an issue is needed.
  report:
    needs: latest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # A run that crashed, timed out or was canceled may have left no report:
      # the next step then opens a TOOLING issue instead of failing here.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: compat-report
          path: ${{ runner.temp }}/compat-report
      # The version to report on comes from here, not from the report: the
      # input when one was given, otherwise the registry.
      - name: Find the expected version
        id: expected
        run: |
          version="$COMPAT_SDK_VERSION"
          if [ "$version" = latest ]; then
            version="$(npm view @linear/sdk version)"
          fi
          # The whole value must match, not just one of its lines.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a plain version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue for this SDK version
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ runner.temp }}/compat-report
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: node compat/lib/issue.mjs "$REPORT_DIR/compat-report.json" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --expected-version "$EXPECTED_VERSION"
