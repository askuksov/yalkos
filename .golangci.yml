version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gocritic
  exclusions:
    rules:
      # gqlgen names resolvers and their parameters after schema fields and
      # arguments (labelIds, stateIds).
      - path: \.resolvers\.go$
        linters: [revive]
        text: "var-naming: method"
      # Resolvers keep every schema argument; some are accepted and ignored.
      - path: \.resolvers\.go$
        linters: [revive]
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/askuksov/yalkos
