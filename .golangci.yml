version: "2"

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gocritic
  exclusions:
    rules:
      # gqlgen names resolver parameters after schema arguments (stateIds).
      - path: \.resolvers\.go$
        linters: [revive]
        text: "var-naming: method parameter"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/askuksov/yalkos
