schema:
  - api/graphql/native/*.graphqls

exec:
  filename: internal/graphql/native/generated.go
  package: native

model:
  filename: internal/graphql/native/models_gen.go
  package: native

resolver:
  layout: follow-schema
  dir: internal/graphql/native
  package: native
  filename_template: "{name}.resolvers.go"

omit_slice_element_pointers: true

# Nullable input fields become graphql.Omittable: omitted vs explicit null.
nullable_input_omittable: true

models:
  Date:
    model: github.com/askuksov/yalkos/internal/graphql/native.Date
  Project:
    model: github.com/askuksov/yalkos/internal/graphql/native.Project
  State:
    model: github.com/askuksov/yalkos/internal/graphql/native.State
  Issue:
    model: github.com/askuksov/yalkos/internal/graphql/native.Issue
  HistoryEntry:
    model: github.com/askuksov/yalkos/internal/graphql/native.HistoryEntry
